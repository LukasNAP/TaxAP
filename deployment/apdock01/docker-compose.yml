services:
  taxap-app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - taxap-review-data:/data
    networks:
      - taxap-internal
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  taxap-proxy:
    image: nginx:alpine
    container_name: taxap-proxy
    restart: unless-stopped
    depends_on:
      - taxap-app
    ports:
      - "${TAXAP_HTTPS_PORT:-5017}:443"
    volumes:
      - ./nginx/taxap-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      # IT must provide these two read-only mounts from the approved wildcard certificate location.
      - ${TAXAP_TLS_CERT_PATH}:/etc/nginx/certs/taxap.crt:ro
      - ${TAXAP_TLS_KEY_PATH}:/etc/nginx/certs/taxap.key:ro
    networks:
      - taxap-internal
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  taxap-internal:
    driver: bridge

volumes:
  taxap-review-data:
