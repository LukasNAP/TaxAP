# Entra tenant/client/group/redirect settings are mandatory Compose environment values.
provider = "entra-id"
http_address = "0.0.0.0:4180"
reverse_proxy = true
upstreams = ["http://taxap-router:8080/"]
upstream_timeout = "180s"
proxy_prefix = "/oauth2"
scope = "openid profile email"
code_challenge_method = "S256"

# A matching tenant AND the configured group are required. No email-domain-only access.
email_domains = ["*"]
client_secret_file = "/run/secrets/taxap-signin-client-secret"
cookie_secret_file = "/run/secrets/taxap-signin-cookie-secret"
cookie_name = "__Host-taxap_sso"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_path = "/"
cookie_expire = "8h"
cookie_refresh = "1h"

# APIs must reject expired/absent sessions, not return the Microsoft login page as data.
api_routes = ["^/api(?:/|$)"]
skip_provider_button = true
skip_jwt_bearer_tokens = false
skip_auth_preflight = false
pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
set_xauthrequest = false
request_logging = false
auth_logging = false
standard_logging = true
