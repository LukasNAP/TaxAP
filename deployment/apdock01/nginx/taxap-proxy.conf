server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/taxap.crt;
    ssl_certificate_key /etc/nginx/certs/taxap.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 2m;

    # Rendered by nginx's template entrypoint. Reject unapproved Host headers, including ports.
    set $request_origin "https://$http_host";
    if ($request_origin != "${TAXAP_ALLOWED_ORIGIN}") { return 421; }

    # Callback URLs contain authorization codes; never record request URLs in access logs.
    access_log off;
    error_log /dev/stderr crit;

    # Every path, including /api/ and /oauth2/callback, passes through sign-in.
    # There must be no direct taxap-app upstream in this public server.
    location / {
        proxy_pass http://taxap-signin:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Auth-Request-Redirect "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Auth-Request-User "";
        proxy_set_header X-Auth-Request-Email "";
        proxy_read_timeout 180s;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
    }
}
