server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/taxap.crt;
    ssl_certificate_key /etc/nginx/certs/taxap.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 2m;

    # Only Nginx reaches the connector. Browsers use the same authenticated origin for /api,
    # while the connector remains absent from the host's published ports.
    location /api/ {
        proxy_pass http://taxap-app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://taxap-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
