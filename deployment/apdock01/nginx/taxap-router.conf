# Internal only: Compose must never publish this listener or the application ports.
server {
    listen 8080;
    server_name _;
    client_max_body_size 2m;
    access_log off;
    error_log /dev/stderr crit;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    # Authentication gates access only for now; no client-supplied identity is trusted.
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_read_timeout 180s;

    location /api/ {
        proxy_pass http://taxap-app:3001;
    }
    location / {
        proxy_pass http://taxap-app:3000;
    }
}
